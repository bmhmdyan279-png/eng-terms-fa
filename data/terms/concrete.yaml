  definition_fa: مادهٔ چسبانندهٔ هیدرولیکی که عمدتاً از پختن ترکیب سنگ آهک و خاک رس (کلینکر) و آسیاب آن همراه با مقدار تنظیم‌شده‌ای گچ به دست می‌آید؛ گچ زمان گیرش را کنترل می‌کند. در ترکیب با آب، خمیر سیمان طی واکنش هیدراتاسیون سخت می‌شود و برخلاف چسب‌های معمولی حتی در زیر آب هم به گیرش و کسب مقاومت ادامه می‌دهد.
  synonyms:
