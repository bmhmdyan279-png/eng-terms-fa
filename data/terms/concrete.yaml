  definition_fa: فولاد تقویتی — به شکل میلگرد، خاموت، خرک یا مش — که درون بتن جای می‌گیرد تا مقاومت کششی و برشی عضو را تأمین کند، زیرا بتن در کشش رفتاری شکننده و ضعیف دارد. آرماتور همچنین عرض ترک را کنترل می‌کند و نیرو را میان اجزای سازه منتقل می‌سازد. پوشش بتن روی آرماتور نقش محافظت در برابر خوردگی را دارد و کمینهٔ آن در آیین‌نامه تعیین شده است.
