  - بتن تازه باید پیش از آغاز گیرش، متراکم و بلافاصله عمل‌آوری شود.
  root_fa: بتن
  etymology_fa: وام‌واژه از فرانسوی béton که خود از لاتین bitumen (قیر، مادهٔ چسباننده) گرفته شده است؛ در فارسی گاه به اشتباه «بتون» نوشته یا گفته می‌شود.
