  root_fa: سیمان
  etymology_fa: وام‌واژه از انگلیسی cement یا فرانسوی ciment، هر دو از لاتین caementum به معنای سنگ خردشده. نام «سیمان پرتلند» از شباهت رنگ بتن سخت‌شده با سنگ پرتلند انگلستان گرفته شده است.
