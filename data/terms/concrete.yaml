  definition_fa: مصالح ساختمانیِ سنگ‌مصنوعی که از اختلاط سنگدانهٔ ریز و درشت، سیمان هیدرولیک، آب و در صورت نیاز افزودنی به دست می‌آید. مقاومت فشاری آن بالا و مقاومت کششی‌اش ناچیز است، به‌همین دلیل معمولاً با آرماتور ترکیب می‌شود. سخت شدن بتن نتیجهٔ واکنش هیدراتاسیون سیمان است نه خشک شدن؛ از این رو عمل‌آوری مرطوب و پیوسته نقش تعیین‌کننده در دستیابی به مقاومت طراحی و دوام دارد.
