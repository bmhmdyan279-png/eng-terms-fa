# رجیستری منابع معتبر — تنها منبع مجاز برای فیلد references در مدخل‌ها.
#
# چرا این فایل وجود دارد؟ سیاست پروژه «هر ادعا باید قابل اثبات باشد» است.
# ارجاع‌دهی به استانداردِ ساختگی، بدترین نوع آلودگی محتوای علمی است؛ بنابراین
# scripts/validate_content.py هر references[].code را با این رجیستری می‌سنجد و
# کد ناشناخته = خطای بازدارندهٔ CI.
#
# قاعدهٔ صداقت برای خودِ این فایل:
#   * فقط منبعی ثبت می‌شود که وجودش راستی‌آزمایی شده باشد (نشانی/ناشر/عنوان).
#   * فیلد url تنها وقتی درج می‌شود که نشانی واقعاً بررسی شده باشد؛ حدس ممنوع.
#   * `verification` وضعیت راستی‌آزمایی را مستند می‌کند:
#       confirmed = وجود و عنوان از منبع رسمی/فروشگاه استاندارد راستی‌آزمایی شد
#       declared  = پروژه آن را به‌عنوان منبع محتوا اعلام کرده (docs/about.md)
#   * «استاندارد ملی ایران شماره ۶۶۴» که در نسخهٔ پیشین به بتن ارجاع شده بود
#     در هیچ فهرستی از استانداردهای INSO یافت نشد و عمداً در این رجیستری نیامد؛
#     ارجاع‌های بتن به ACI 116R / ASTM C125 / آبا منتقل شدند.
schema: standards-v1
updated: "2026-09-10"

