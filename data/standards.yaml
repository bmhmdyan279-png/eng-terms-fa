# منابع صنفی/ثانویه — برای واژه‌های سنتی بنایی که هیچ مرجع هنجاری ندارند.
# هر دو نشانی در همین بازبینی واکشی و راستی‌آزمایی شده‌اند؛ صریحاً «مرجع
# هنجاری نیستند» تا هیچ‌کس آن‌ها را با استاندارد اشتباه نگیرد.
- code: "واژه‌نامهٔ اصطلاحات سنتی آجرکاری"
  type: other
  org: "گردآوری صنفی (ثانویه)"
  title: "لغت‌نامهٔ اصطلاحات آجری در معماری ایرانی"
  url: "https://vendabrick.com/brick-expression/"
  verification: confirmed
  domains: [construction, materials]
  scope_fa: >-
    معنی‌شناسی واژه‌های سنتی آجرکاری (اسپر، پاطاق، کلوک، چهار دانگ، نره، سرسفت،
    سرواافتاده، زنجاب، تاریک کردن، کور کردن و مانند آن‌ها). مرجع هنجاری نیست.

- code: "واژه‌نامهٔ اصطلاحات کارگاهی عمران"
  type: other
  org: "گردآوری صنفی (ثانویه)"
  title: "اصطلاحات رایج در پروژه‌های عمرانی"
  url: "https://dirgodaz.com/training/articles/jargons-of-civil-engineering"
  verification: confirmed
  domains: [construction]
  scope_fa: >-
    اصطلاحات کارگاهی رایج در ایران (تماسه، تخماق، تراورس، دج، پاسنگ، توپی و
    مانند آن‌ها). مرجع هنجاری نیست؛ برای راستی‌آزمایی معنی به کار رفته است.

- code: "کتاب آزمایشات فناوری بتن"
  type: book
  org: "منبع اعلام‌شدهٔ پروژه"
  title: "آزمایشات فناوری بتن"
  verification: declared
  domains: [concrete, testing]
