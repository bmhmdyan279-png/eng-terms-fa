site_url: https://bmhmdyan279-png.github.io/eng-terms-fa/
site_name: فرهنگ واژگان تخصصی مهندسی
site_description: دیکشنری تخصصی مهندسی با معادل‌های چندزبانه (FA/EN/FR/DE/AR)
repo_url: https://github.com/bmhmdyan279-png/eng-terms-fa
repo_name: eng-terms-fa

theme:
  name: material
  language: fa
  direction: rtl
  font:
    text: Vazirmatn
    code: Fira Code
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: تغییر به حالت شب
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: تغییر به حالت روز
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.tabs.link
    - content.code.copy
    - navigation.instant
    - navigation.tracking

plugins:
  - search
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/css/extra.css

extra:
  manifest: manifest.webmanifest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bmhmdyan279-png/eng-terms-fa

not_in_nav: |
  terms/*.md

nav:
  - 🏠 خانه: index.md
  - 📖 واژه‌نامه: terms/index.md
  - 📚 واژگان کتاب آزمایش‌های فناوری بتن: book-vocab.md
  - 🏗️ اصطلاحات ساختمان: construction-terms.md
  - ✍️ مشارکت: contribute.md
  - 📄 درباره ما: about.md
  - 📝 ارجاع: citation.md
  - 📨 پیشنهاد غیرفنی: contribute-form.md
