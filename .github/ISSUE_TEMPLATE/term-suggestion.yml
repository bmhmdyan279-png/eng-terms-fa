name: پیشنهاد واژهٔ جدید
description: یک اصطلاح مهندسی برای افزودن به فرهنگ پیشنهاد دهید (فرم ساده)
title: "[واژه جدید]: "
labels: ["term-suggestion", "content"]
body:
  - type: markdown
    attributes:
      value: |
        سپاس! اگر YAML آشناست، سریع‌ترین راه PR مستقیم است (راهنما: CONTRIBUTING.md).
        در غیر این صورت این فرم کافی است — داوطلبان آن را به داده تبدیل می‌کنند.
  - type: input
    id: term_fa
    attributes:
      label: واژهٔ فارسی
      placeholder: "مثلاً: ویبره"
    validations:
      required: true
  - type: input
    id: term_en
    attributes:
      label: معادل انگلیسی (در صورت اطمینان)
      placeholder: "مثلاً: vibration / compaction by vibrator"
    validations:
      required: false
  - type: dropdown
    id: domain
    attributes:
      label: حوزه
      options:
        - فناوری بتن
        - اصطلاحات ساختمانی
        - مکانیک
        - سایر
    validations:
      required: true
  - type: input
    id: synonyms
    attributes:
      label: مترادف‌ها یا شکل‌های گفتاری (اختیاری)
      description: >-
        واژه‌هایی که یک متخصص یا کارگر کارگاه به‌جای این اصطلاح به کار می‌برد —
        این‌ها مستقیماً کیفیت جستجو را بالا می‌برند.
      placeholder: "مثلاً: ویبره، ویبراتور (برای «لرزاننده»)"
    validations:
      required: false
  - type: input
    id: source
    attributes:
      label: منبع (اختیاری ولی تعیین‌کننده)
      description: >-
        استاندارد، کتاب یا واژه‌نامه‌ای که این اصطلاح را با این معنی دیده‌اید.
        منبع باید در `data/standards.yaml` ثبت شود تا قابل استناد باشد.
      placeholder: "مثلاً: ACI 116R یا مبحث هشتم مقررات ملی ساختمان"
    validations:
      required: false
  - type: textarea
    id: definition
    attributes:
      label: تعریف یا توضیح کوتاه (اختیاری ولی ارزشمند)
      placeholder: این اصطلاح دقیقاً یعنی چه و کجا به کار می‌رود؟
    validations:
      required: false
  - type: input
    id: source
    attributes:
      label: منبع (استاندارد/کتاب/تجربهٔ کارگاهی)
      placeholder: "مثلاً: ACI 318-19 یا تجربهٔ اجرایی"
    validations:
      required: false
