name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # تاریخچهٔ کامل لازم است تا validate_data.py بتواند
          # تغییرناپذیری slugها را نسبت به origin/main بررسی کند.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Validate data (schema, uniqueness, immutable slugs, translations)
        run: python scripts/validate_data.py

      - name: Run tests
        run: pytest tests/ -v

      - name: Build pages
        run: python scripts/build_pages.py

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: pre-commit
        uses: pre-commit/action@v3.0.1
