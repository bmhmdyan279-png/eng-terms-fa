name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate data
        run: python scripts/validate_data.py

      - name: Build pages
        run: python scripts/build_pages.py

      - name: Audit translations (multilingual smoke test)
        run: python scripts/audit_translations.py --strict

      - name: Generate JSON API
        run: python scripts/generate_api.py

      - name: Run tests
        run: pytest tests/

      - name: Build site
        run: mkdocs build --strict

      - name: Setup Node (Pagefind)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Pagefind search index
        run: npx --yes pagefind --site site/

      - name: Generate exports and publish downloads
        run: |
          python scripts/generate_exports.py
          mkdir -p site/downloads
          cp output/anki.apkg output/terms.csv output/terms.pdf site/downloads/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4